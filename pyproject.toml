[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingue"
version = "0.1.0"
description = "Edición bilingüe en dos columnas: traduce un libro localmente con Argos Translate y genera un HTML paralelo"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "argostranslate>=1.9",
    "ctranslate2>=4.8,<5",
    "lxml",
    "beautifulsoup4",
    "python-docx",
    "pymupdf",
    "tqdm",
    "langdetect",
    # En macOS Intel, torch quedó congelado en 2.2.2 (última con ruedas
    # x86_64), compilada contra NumPy 1.x: con NumPy 2 revienta al cargar.
    'numpy<2; sys_platform == "darwin" and platform_machine == "x86_64"',
]

[project.scripts]
bilingue = "bilingue.cli:main"

[project.gui-scripts]
# gui-script: en Windows usa pythonw y no abre una consola parásita.
bilingue-gui = "bilingue.gui:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["bilingue", "bilingue.extract"]
