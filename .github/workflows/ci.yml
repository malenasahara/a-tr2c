name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
      BILINGUE_TEST_TIMEOUT: "600"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ~150 MB del paquete en→es + recursos del segmentador, dentro del
      # directorio de datos de Argos (rutas XDG en los tres sistemas).
      - name: Caché de paquetes Argos
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-es-${{ runner.os }}-v2

      - name: Instalación limpia
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Prueba de extremo a extremo (preguntas por stdin)
        run: pytest -q

  offline:
    name: offline (ubuntu, unshare -n)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Caché de paquetes Argos
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-es-Linux-v2

      - name: Instalación limpia
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Aprovisionamiento online (par en→es y segmentador)
        run: |
          printf 'en\nes\n' | python -m bilingue tests/data/sample-en.txt
          test -f tests/data/sample-en.bilingue.html
          rm -f tests/data/sample-en.bilingue.html

      - name: Traducción sin red (namespace de red vacío)
        run: |
          printf 'en\nes\n' | sudo unshare -n env "HOME=$HOME" "PATH=$PATH" python -m bilingue tests/data/sample-en.txt
          test -f tests/data/sample-en.bilingue.html
          grep -q 'Traducción (es)' tests/data/sample-en.bilingue.html

  build:
    name: build (${{ matrix.os }})
    # Tras e2e: sin build si fallan los tests, y reutiliza la caché -v2 que
    # e2e acaba de guardar (evita la doble descarga en arranque frío).
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: windows-x64
            exe: bilingue.exe
          - os: macos-15-intel
            plat: macos-x86_64
            exe: bilingue
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
      BILINGUE_TEST_TIMEOUT: "600"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Caché de paquetes Argos
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-es-${{ runner.os }}-v2

      - name: Instalación limpia (con build)
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,build]"

      - name: Versión del proyecto
        id: version
        shell: bash
        run: echo "version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build PyInstaller (onedir, CLI + GUI)
        run: pyinstaller --noconfirm --clean packaging/bilingue.spec

      - name: La pila stanza/torch no está en el bundle
        shell: bash
        run: |
          for pkg in torch stanza spacy sympy networkx thinc blis preshed cymem murmurhash srsly emoji; do
            if compgen -G "dist/bilingue/_internal/${pkg}*" > /dev/null; then
              echo "::error::${pkg} presente en el bundle"
              exit 1
            fi
          done

      - name: e2e real contra el ejecutable congelado
        shell: bash
        env:
          BILINGUE_E2E_EXE: ${{ github.workspace }}/dist/bilingue/${{ matrix.exe }}
        run: pytest -q

      - name: Tamaño y arranque (informativo)
        shell: bash
        run: |
          du -sh dist/bilingue
          time "dist/bilingue/${{ matrix.exe }}" --help > /dev/null

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\bilingue -DestinationPath "bilingue-${{ steps.version.outputs.version }}-windows-x64.zip"

      # ditto conserva los bits de ejecución (Compress-Archive y el artefacto
      # crudo no); imprescindible para que el binario de macOS arranque.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/bilingue "bilingue-${{ steps.version.outputs.version }}-macos-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: bilingue-${{ steps.version.outputs.version }}-${{ matrix.plat }}
          path: bilingue-*.zip
          if-no-files-found: error

  release:
    name: release (tag v*)
    # on: push sin filtros también se dispara con tags; este if lo acota.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*.zip
          fail_on_unmatched_files: true
          body: |
            App autocontenida (sin Python): descomprime y ejecuta `bilingue`
            (CLI) o `bilingue-gui` (interfaz gráfica).

            - Windows 10/11 x64: `bilingue-<versión>-windows-x64.zip`.
            - macOS Intel (13 Ventura o posterior):
              `bilingue-<versión>-macos-x86_64.zip`; sin firma de Apple — tras
              descomprimir, libera la cuarentena con
              `xattr -dr com.apple.quarantine bilingue/`.

            La primera traducción de cada par de idiomas descarga ~150 MB a
            `~/.local/share/argos-translate`; después funciona 100 % sin
            conexión. Desde v0.2.0 el segmentador de frases es MiniSBD:
            alguna traducción puede diferir de v0.1.0 (sigue siendo
            determinista).
